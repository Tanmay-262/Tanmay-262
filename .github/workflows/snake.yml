name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Tanmay-262
          outputs: |
            dist/github-snake.svg?color_snake=#58A6FF&color_dots=#21262D,#1F6FEB,#388BFD,#58A6FF,#79C0FF
            dist/github-snake-dark.svg?color_snake=#58A6FF&color_dots=#21262D,#1F6FEB,#388BFD,#58A6FF,#79C0FF

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
